apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# The generated name carries a content hash, so any change to the config or
# rules rolls the Prometheus pod and it loads the new version.
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    options:
      labels:
        app.kubernetes.io/name: prometheus
    files:
      - prometheus.yml
      - rules/healthqueue-slo.rules.yml
