apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthqueue-api
  namespace: healthqueue
  labels:
    app.kubernetes.io/name: healthqueue-api
spec:
  # Appointments are stored in process memory; scaling beyond one replica
  # would split data across pods. Move to a shared database before scaling out.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthqueue-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthqueue-api
          image: ghcr.io/jackj119/healthqueue-platform@sha256:531b3bf74ce1d9cdfe4ce90aff9be0cd8ded5de76642d417cc57c350940e7a76
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: healthqueue-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn needs a writable temp dir for worker heartbeat files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
