apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthqueue-api
  namespace: healthqueue
  labels:
    app.kubernetes.io/name: healthqueue-api
spec:
  # Appointments are stored in process memory; scaling beyond one replica
  # would split data across pods. Move to a shared database before scaling out.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: healthqueue-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthqueue-api
      # Lets an annotation-based Prometheus scrape config find the pod without
      # a ServiceMonitor or other CRD.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      # The app never calls the Kubernetes API, so it has no use for a token,
      # and a compromised container would have no token to steal.
      automountServiceAccountToken: false
      # Satisfies the namespace's "restricted" Pod Security level; the UID is
      # the one created in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthqueue-api
          # Pinned by digest, not tag: the digest is the exact image CI scanned,
          # signed and attested, and it cannot be re-pointed. The deploy job in
          # ci.yml rewrites the next line, so keep it free of comments.
          image: ghcr.io/jackj119/healthqueue-platform@sha256:67d726af141c3c34f048a03b23d307087438eb610076fbb4b22dc1a3622fa122
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: healthqueue-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # No CPU limit, to avoid throttling during short bursts. Memory is
          # limited because the scheduler cannot reclaim it from a leaking pod.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            # The app writes nothing to disk, so a read-only root stops an
            # attacker from changing the code or dropping tools into the container.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn needs a writable temp dir for worker heartbeat files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
