apiVersion: v1
kind: Service
metadata:
  name: healthqueue-api
  namespace: healthqueue
  labels:
    app.kubernetes.io/name: healthqueue-api
spec:
  # Reachable only inside the cluster. External access is left to an ingress
  # or `kubectl port-forward`, so nothing is exposed by default.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: healthqueue-api
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
